name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install siblings from PyPI
        run: |
          pip install --upgrade pip
          pip install "tiny-router>=0.7.0" "tiny-validator>=0.5.0"
      - name: Install tiny-mcp-skel
        run: pip install -e .
      - name: Install test dependencies
        run: pip install jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate responses against the MCP JSON Schema
        run: python -m unittest tests.test_tiny_mcp_skel.TestSchemaConformance -v
