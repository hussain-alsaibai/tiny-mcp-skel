name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install siblings from GitHub
        run: |
          pip install --upgrade pip
          # tiny-validator is not published on PyPI, and the newest tiny-router
          # release there (0.0.8) does not satisfy the >=0.7.0 pin, so these
          # two siblings are installed straight from their repositories.
          pip install "tiny-router @ git+https://github.com/hussain-alsaibai/tiny-router.git"
          pip install "tiny-validator @ git+https://github.com/hussain-alsaibai/tiny-validator.git"
      - name: Install tiny-mcp-skel
        run: pip install -e .
      - name: Install test dependencies
        run: pip install jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate responses against the MCP JSON Schema
        run: python -m unittest tests.test_tiny_mcp_skel.TestSchemaConformance -v
